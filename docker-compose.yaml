services:

  rviz:
    extends:
      service: realsense
    image: "rviz:latest"
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: ${DISPLAY}
    command: ros2 run rviz2 rviz2

  charuco-calibration:
    extends:
      service: realsense
    image: "charuco_calibration:latest"
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: ${DISPLAY}
    command: >
      ros2 run camera_calibration cameracalibrator
      --no-service-check
      --square 0.0320
      --pattern charuco
      --size 5x7
      --charuco_marker_size 0.0246
      --aruco_dict 6x6_250
      --ros-args
      --remap image:=/camera/infra1/image_rect_raw
      --remap camera:=/camera/infra1

  checkerboard-calibration:
    extends:
      service: realsense
    image: "checkerboard_calibration:latest"
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: ${DISPLAY}
    command: >
      ros2 run camera_calibration cameracalibrator
      --no-service-check
      --size 5x8
      --square 0.0257
      --ros-args
      --remap image:=/camera/infra1/image_rect_raw

  realsense:
    build: 
      context: .
      dockerfile: camera.Dockerfile
      args:
        - USER_UID=1001
        - USER_GID=1001
        - USERNAME=${USERNAME}
    image: "realsense:latest"
    network_mode: host
    ipc: host
    init: true
    privileged: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
      - ./advanced.json:/config/advanced.json:ro
    device_cgroup_rules:
      - 'c 81:* rmw'
      - 'c 189:* rmw'
    command: > 
      ros2 launch realsense2_camera rs_launch.py 
      camera_name:=camera
      camera_namespace:=/
      enable_color:=false
      enable_depth:=false
      enable_infra1:=true
      enable_gyro:=true
      enable_accel:=true
      unite_imu_method:=2
      json_file_path:=/config/advanced.json
